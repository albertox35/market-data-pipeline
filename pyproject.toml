[build-system]
requires = ["setuptools>=77", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-pipeline"
version = "0.1.0"
description = "Pipeline de market data de baja latencia: ring buffer SPSC wait-free en C++20, reconstruccion de libro L2 y percentiles de latencia"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alberto Gertzain Sanchez Gonzalez" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "timing: mide rendimiento; depende de la carga de la maquina y no se ejecuta en CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"
